version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: overview-postgres
    restart: always
    environment:
      POSTGRES_USER: overview_user
      POSTGRES_PASSWORD: overview_password
      POSTGRES_DB: overview_db
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: